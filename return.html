<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to The Atelier — House of Elévara</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="House of Elévara">
<meta property="og:description" content="Return to The Atelier.">
<meta property="og:type" content="website">
<style>
  :root {
    --ink: #F4F1EA;
    --ink-dim: rgba(244, 241, 234, 0.55);
    --ink-faint: rgba(244, 241, 234, 0.32);
    --gold: #C9A961;
    --ground: #0A0A0A;
    --surface: #121212;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    background: var(--surface);
    border: 1px solid rgba(201, 169, 97, 0.18);
    padding: 48px 28px 40px;
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .mark {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 28px;
  }
  .rule {
    width: 40px; height: 1px;
    background: var(--gold);
    opacity: 0.5;
    margin: 0 auto 28px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 27px;
    font-weight: 400;
    line-height: 1.25;
    margin-bottom: 14px;
  }
  p {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink-dim);
    margin-bottom: 10px;
  }
  .note {
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-top: 26px;
    font-style: italic;
  }
  .links {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(244, 241, 234, 0.07);
    display: flex;
    justify-content: center;
    gap: 22px;
  }
  .links a {
    color: var(--ink-faint);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .links a:hover { color: var(--gold); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">House of Elévara</div>
    <div class="rule"></div>
    <h1>You're all set</h1>
    <p>Stripe has finished with this step.</p>
    <p>Close this tab and reopen The Atelier — your account will refresh automatically.</p>
    <p class="note">If something looks out of date, pull down to refresh inside the app.</p>
    <div class="links">
      <a href="https://www.houseofelevara.com">Home</a>
      <a href="https://www.houseofelevara.com/contact.html">Contact</a>
      <a href="https://www.houseofelevara.com/terms.html">Terms</a>
    </div>
  </main>
</body>
</html>
